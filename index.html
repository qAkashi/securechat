<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SecureChat — Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🔐</div>
      <div class="auth-logo-title">SecureChat</div>
      <div class="auth-logo-sub">E2E Encrypted · Zero Knowledge</div>
    </div>

    <div class="tg-tabs mb-0">
      <button class="tg-tab active" id="tabLogin">Войти</button>
      <button class="tg-tab" id="tabReg">Регистрация</button>
    </div>

    <form id="authForm" novalidate class="mt-3">
      <!-- Username -->
      <div class="mb-3">
        <label class="tg-label">Имя пользователя</label>
        <input class="form-control tg-input" id="fUsername" type="text"
               placeholder="alice_dev" required minlength="3" maxlength="20"/>
        <span class="field-error" id="errUsername"></span>
      </div>

      <!-- Email (register only) -->
      <div class="collapse-field mb-3" id="fieldEmail">
        <label class="tg-label">Email</label>
        <input class="form-control tg-input" id="fEmail" type="email" placeholder="user@example.com"/>
        <span class="field-error" id="errEmail"></span>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="tg-label">Пароль</label>
        <div class="pw-wrap">
          <input class="form-control tg-input" id="fPassword" type="password"
                 placeholder="Минимум 8 символов" required minlength="8"/>
          <button type="button" class="pw-eye" id="eyeBtn">👁</button>
        </div>
        <span class="field-error" id="errPassword"></span>
      </div>

      <!-- Confirm (register only) -->
      <div class="collapse-field mb-3" id="fieldConfirm">
        <label class="tg-label">Повторите пароль</label>
        <div class="pw-wrap">
          <input class="form-control tg-input" id="fConfirm" type="password" placeholder="••••••••"/>
        </div>
        <span class="field-error" id="errConfirm"></span>
      </div>

      <button type="submit" class="tg-btn-primary" id="submitBtn">Войти</button>
    </form>

    <div class="auth-security">
      <span class="dot"></span>
      X25519 + ChaCha20-Poly1305 · TLS 1.3
    </div>
  </div>

  <!-- Success overlay -->
  <div class="success-screen" id="successScreen">
    <div class="success-icon-wrap">✓</div>
    <div class="success-text">Аутентификация успешна</div>
    <div class="success-sub">Генерация ключей шифрования…</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
